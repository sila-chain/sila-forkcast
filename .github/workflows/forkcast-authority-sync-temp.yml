name: Forkcast Authority Sync

on:
  push:
    branches:
      - sila/forkcast-latest-pure-20260913
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name == 'push' || github.head_ref == 'sila/forkcast-latest-pure-20260913'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sila/forkcast-latest-pure-20260913
          fetch-depth: 0

      - name: Synchronize exact upstream delta as pure Sila
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, subprocess

          BASE = "62e1d697ab9c36ed1b5fb4f6e500b5f6bbbaa7b8"
          HEAD = "5cf5d503a33858fabb35af136ff0d9c6b366b2e9"
          BRANCH = "sila/forkcast-latest-pure-20260913"
          WORKFLOW = Path('.github/workflows/forkcast-authority-sync-temp.yml')
          upstream = Path('/tmp/forkcast-upstream')

          def run(args, cwd=None, capture=False):
              return subprocess.run(args, cwd=cwd, text=True, check=True,
                                    stdout=subprocess.PIPE if capture else None,
                                    stderr=subprocess.PIPE if capture else None)

          if upstream.exists():
              shutil.rmtree(upstream)
          run(['git', 'clone', '--quiet', 'https://github.com/ethereum/forkcast.git', str(upstream)])
          run(['git', 'checkout', '--quiet', HEAD], cwd=upstream)

          diff = run(['git', 'diff', '--name-status', BASE, HEAD], cwd=upstream, capture=True).stdout.splitlines()

          def map_path(path: str) -> str:
              parts = path.split('/')
              mapped = []
              for p in parts:
                  p = re.sub(r'(?<![A-Za-z0-9])eips(?![A-Za-z0-9])', 'sips', p)
                  p = re.sub(r'(?<![A-Za-z0-9])EIPs(?![A-Za-z0-9])', 'SIPs', p)
                  p = re.sub(r'(?<![A-Za-z0-9])eip(?![A-Za-z0-9])', 'sip', p)
                  p = re.sub(r'(?<![A-Za-z0-9])EIP(?![A-Za-z0-9])', 'SIP', p)
                  mapped.append(p)
              return '/'.join(mapped)

          def pure_sila(text: str, suffix: str) -> str:
              text = text.replace('github.com/ethereum/', 'github.com/sila/')
              text = text.replace('https://ethereum.org', 'https://sila.org')
              text = text.replace('http://ethereum.org', 'http://sila.org')
              text = text.replace('eips.ethereum.org', 'sips.sila.org')
              text = text.replace('Ethereum Foundation', 'Sila Foundation')
              text = text.replace('Etherscan', 'SilaScan')
              text = text.replace('WETH', 'WSIL').replace('IWETH', 'IWSIL')
              text = text.replace('IERC', 'ISRC').replace('AERC', 'ASRC').replace('IEIP', 'ISIP')

              token_pairs = [
                  ('ETHEREUM', 'SILA'), ('Ethereum', 'Sila'), ('ethereum', 'sila'),
                  ('ERCS', 'SRCS'), ('ERCs', 'SRCs'), ('ERC', 'SRC'), ('erc', 'src'),
                  ('EIPs', 'SIPs'), ('eips', 'sips'), ('EIP', 'SIP'), ('eip', 'sip'),
                  ('Ether', 'Sila'), ('ether', 'sila'),
                  ('ETH', 'SIL'), ('Eth', 'Sil'), ('eth', 'sil'),
                  ('Sepolia', 'SilaSepolia'), ('Holesky', 'SilaHolesky'),
                  ('Deneb', 'SilaDeneb'), ('Fulu', 'SilaFulu'), ('PeerDAS', 'SilaPeerDAS'),
                  ('Cancun', 'SilaCancun'), ('Shanghai', 'SilaShanghai'), ('Prague', 'SilaPrague'),
                  ('Osaka', 'SilaOsaka'), ('Paris', 'SilaParis'), ('Amsterdam', 'SilaAmsterdam'),
                  ('Kovan', 'SilaKovan'), ('Mainnet', 'SilaMainnet'), ('MAINNET', 'SILA_MAINNET'),
              ]
              for old, new in token_pairs:
                  text = re.sub(r'(?<![A-Za-z0-9_])' + re.escape(old) + r'(?![A-Za-z0-9_])', new, text)

              if suffix in {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}:
                  text = re.sub(r"(['\"])mainnet\1", lambda m: m.group(1) + 'sila-mainnet' + m.group(1), text)
              else:
                  text = re.sub(r'(?<![A-Za-z0-9_])mainnet(?![A-Za-z0-9_])', 'sila-mainnet', text)
              return text

          staged = []
          for row in diff:
              cols = row.split('\t')
              status = cols[0]
              src = cols[-1]
              dst = map_path(src)
              target = Path(dst)
              if status.startswith('D'):
                  if target.exists():
                      target.unlink()
                      staged.append(dst)
                  continue
              source = upstream / src
              target.parent.mkdir(parents=True, exist_ok=True)
              raw = source.read_bytes()
              try:
                  text = raw.decode('utf-8')
              except UnicodeDecodeError:
                  target.write_bytes(raw)
              else:
                  target.write_text(pure_sila(text, target.suffix.lower()), encoding='utf-8')
              staged.append(dst)

          residuals = []
          actionable = re.compile(r'(?<![A-Za-z0-9_])(Ethereum|ethereum|ETHEREUM|EIPs|EIP|eips|eip|ERCs|ERC|erc|Mainnet|MAINNET)(?![A-Za-z0-9_])')
          for p in staged:
              path = Path(p)
              if not path.exists() or path.suffix.lower() in {'.png','.jpg','.jpeg','.gif','.webp','.ico','.woff','.woff2'}:
                  continue
              try:
                  t = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for n, line in enumerate(t.splitlines(), 1):
                  if actionable.search(line):
                      residuals.append(f'{p}:{n}:{line[:180]}')
          if residuals:
              print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT=', len(residuals))
              print('\n'.join(residuals[:100]))
              raise RuntimeError('actionable identity residuals remain')
          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT=0')
          print('UPSTREAM_AUTHORITY=' + HEAD)
          print('DELTA_FILE_COUNT=' + str(len(staged)))

          run(['npm', 'ci'])
          run(['npm', 'run', 'build'])

          run(['git', 'config', 'user.name', 'github-actions[bot]'])
          run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'])
          for p in staged:
              run(['git', 'add', '--', p])
          if WORKFLOW.exists():
              WORKFLOW.unlink()
              run(['git', 'add', '-u', '--', str(WORKFLOW)])
          run(['git', 'commit', '-m', 'sync: latest Forkcast authority 5cf5d503'])
          run(['git', 'push', 'origin', 'HEAD:' + BRANCH])
          PY
