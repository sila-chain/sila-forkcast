name: Final Root Authority

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rootify:
    if: github.event.pull_request.title == 'Finalize Forkcast root authority 449d492a'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout work branch
        uses: actions/checkout@v6
        with:
          ref: sila/forkcast-latest-pure-20260910
          fetch-depth: 0
      - name: Checkout canonical merged main workflows
        uses: actions/checkout@v6
        with:
          ref: main
          path: canonical-main
          fetch-depth: 1
      - name: Revalidate exact final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a canonical-main/.github/workflows/. .github/workflows/
          rm -rf canonical-main
          npm ci
          npm run build
      - name: Create and publish orphan root candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan sila-final-root
          git add -A
          git commit -m 'sync: latest Forkcast authority 449d492a'
          test "$(git rev-list --parents -n 1 HEAD | wc -w)" -eq 1
          git push --force origin HEAD:sila/root-final-449d492a
