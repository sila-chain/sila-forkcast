name: Latest Authority Delta Sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.title == 'Sync latest Forkcast authority 4b42b644 as pure Sila'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Sila branch
        uses: actions/checkout@v6
        with:
          ref: sila/forkcast-latest-pure-20260910
          fetch-depth: 0

      - name: Checkout clean Sila main
        uses: actions/checkout@v6
        with:
          repository: sila-chain/sila-forkcast
          ref: main
          path: _target
          fetch-depth: 1

      - name: Checkout exact latest upstream
        uses: actions/checkout@v6
        with:
          repository: ethereum/forkcast
          ref: 4b42b644ad97bec794eace361b4cada015322442
          path: _upstream
          fetch-depth: 1

      - name: Apply exact three-file upstream delta through Sila identity rules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil
          root=Path.cwd(); up=root/'_upstream'; target=root/'_target'
          files=[
            ('public/eips/history/8037.json','public/sips/history/8037.json'),
            ('public/eips/history/8272.json','public/sips/history/8272.json'),
            ('public/eips/pr-manifest.json','public/sips/pr-manifest.json'),
          ]
          token_map={
            'Ethereum':'Sila','ethereum':'sila','ETHEREUM':'SILA',
            'EIPs':'SIPs','eips':'sips','EIP':'SIP','eip':'sip',
            'ERCs':'SRCs','ercs':'srcs','ERC':'SRC','erc':'src',
            'ETH':'SIL','Eth':'Sil','eth':'sil','Ether':'Sila','ether':'sila',
            'Mainnet':'SilaMainnet','mainnet':'sila-mainnet','MAINNET':'SILA_MAINNET',
            'Sepolia':'SilaSepolia','Holesky':'SilaHolesky','Deneb':'SilaDeneb','Fulu':'SilaFulu',
            'PeerDAS':'SilaPeerDAS','Cancun':'SilaCancun','Shanghai':'SilaShanghai','Prague':'SilaPrague',
            'Osaka':'SilaOsaka','Paris':'SilaParis','Amsterdam':'SilaAmsterdam','Kovan':'SilaKovan'
          }
          literals=[
            ('https://eips.ethereum.org','https://sips.sila.org'),('eips.ethereum.org','sips.sila.org'),
            ('https://github.com/ethereum/','https://github.com/sila-chain/'),('github.com/ethereum/','github.com/sila-chain/'),
            ('https://ethereum.org','https://sila.org'),('ethereum.org','sila.org'),
            ('Ethereum Foundation','Sila Foundation'),('Etherscan','SilaScan'),
            ('WETH','WSIL'),('IWETH','IWSIL'),('IERC','ISRC'),('AERC','ASRC'),('IEIP','ISIP')
          ]
          rx=re.compile(r'\b(?:'+'|'.join(sorted(map(re.escape,token_map),key=len,reverse=True))+r')\b')
          gh=re.compile(r'https?://github\.com/([A-Za-z0-9_.-]+)')
          def convert(s):
            saved=[]
            def protect(m):
              org=m.group(1)
              if org.lower().startswith('ethereum') and org.lower()!='ethereum':
                k=f'__SILA_TP_GITHUB_{len(saved)}__'; saved.append((k,m.group(0))); return k
              return m.group(0)
            s=gh.sub(protect,s)
            for a,b in literals: s=s.replace(a,b)
            s=rx.sub(lambda m:token_map[m.group(0)],s)
            for k,v in saved: s=s.replace(k,v)
            return s
          for src_rel,dst_rel in files:
            src=up/src_rel; dst=root/dst_rel
            dst.parent.mkdir(parents=True,exist_ok=True)
            dst.write_text(convert(src.read_text('utf-8')),'utf-8')
          shutil.rmtree(root/'.github/workflows')
          shutil.copytree(target/'.github/workflows',root/'.github/workflows')
          shutil.rmtree(up); shutil.rmtree(target)

          ids=['Ethereum','ethereum','ETHEREUM','EIPs','eips','EIP','eip','ERCs','ercs','ERC','erc','ETH','Eth','eth','Ether','ether']
          word=re.compile(r'\b(?:'+'|'.join(map(re.escape,ids))+r')\b')
          exact_gh=re.compile(r'github\.com/ethereum(?=/|$|[\s"\'<>),.;:#?])')
          domains=re.compile(r'eips\.ethereum\.org|ethereum\.org')
          def binary(p):
            b=p.read_bytes()[:8192]
            if b'\x00' in b:return True
            try:b.decode('utf-8');return False
            except UnicodeDecodeError:return True
          residual=[]
          for p in root.rglob('*'):
            if '.git' in p.parts:continue
            rel=p.relative_to(root).as_posix()
            if word.search(rel) or exact_gh.search(rel) or domains.search(rel):residual.append('PATH:'+rel)
            if p.is_file() and not binary(p):
              s=p.read_text('utf-8'); s=re.sub(r'https?://github\.com/ethereum[A-Za-z0-9_.-]+','__THIRD_PARTY_GITHUB__',s)
              if word.search(s) or exact_gh.search(s) or domains.search(s):residual.append('TEXT:'+rel)
          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT='+str(len(residual)))
          if residual:
            print('\n'.join(residual[:200])); raise SystemExit(1)
          print('PURE_SILA_IDENTITY_GATE=PASS')
          PY

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Commit verified latest delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'SILA Network'
          git config user.email 'sila-chain@users.noreply.github.com'
          git add -A
          git commit -m 'sync: latest Forkcast authority 4b42b644 as pure Sila'
          git push origin HEAD:sila/forkcast-latest-pure-20260910
