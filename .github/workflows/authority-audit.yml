name: Sila Authority Audit

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authority:
    if: github.event.pull_request.title == 'Post-root Sila Forkcast authority verification'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout root-only Sila main
        uses: actions/checkout@v6
        with:
          ref: main
          path: target
          fetch-depth: 1

      - name: Checkout current upstream main
        uses: actions/checkout@v6
        with:
          repository: ethereum/forkcast
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Verify latest upstream authority
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git -C upstream rev-parse HEAD)"
          echo "CURRENT_UPSTREAM_MAIN=$ACTUAL"
          test "$ACTUAL" = '0c357e072114d2fc791bef9347399790d49d0044'
          echo 'LATEST_UPSTREAM_AUTHORITY_GATE=PASS'

      - name: Verify root-only main and preserved final tree
        shell: bash
        run: |
          set -euo pipefail
          HEAD="$(git -C target rev-parse HEAD)"
          TREE="$(git -C target rev-parse 'HEAD^{tree}')"
          PARENTS="$(git -C target cat-file -p HEAD | grep -c '^parent ' || true)"
          echo "TARGET_HEAD=$HEAD"
          echo "TARGET_TREE=$TREE"
          echo "TARGET_PARENT_COUNT=$PARENTS"
          test "$HEAD" = '1cc78f7eaa5cb662361c66778c5fa013e8a050c0'
          test "$TREE" = '8f11f93cf51f67b0bca5180c5aac49956590c516'
          test "$PARENTS" = '0'
          echo 'ROOT_ONLY_HISTORY_GATE=PASS'
          echo 'PRESERVED_FINAL_TREE_GATE=PASS'

      - name: Verify Pure Sila actionable identity residuals
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('target')
          U='Ethereum'; u='ethereum'; UU='ETHEREUM'
          ids=[U,u,UU,'EIPs','eips','EIP','eip','ERCs','ercs','ERC','erc','ETH','Eth','eth','Ether','ether']
          word_identity=re.compile(r'\b(?:'+'|'.join(map(re.escape,ids))+r')\b')
          exact_gh=re.compile(r'github\.com/'+re.escape(u)+r'(?=/|$|[\s"\'<>),.;:#?])')
          exact_domains=re.compile(re.escape('eips.ethereum.org')+'|'+re.escape('ethereum.org'))

          def binary(p):
              b=p.read_bytes()[:8192]
              if b'\x00' in b:
                  return True
              try:
                  b.decode('utf-8')
                  return False
              except UnicodeDecodeError:
                  return True

          residual=[]
          for p in root.rglob('*'):
              if '.git' in p.parts:
                  continue
              rel=p.relative_to(root).as_posix()
              if word_identity.search(rel) or exact_gh.search(rel) or exact_domains.search(rel):
                  residual.append('PATH:'+rel)
              if p.is_file() and not binary(p):
                  s=p.read_text('utf-8')
                  masked=re.sub(r'https?://github\.com/'+re.escape(u)+r'[A-Za-z0-9_.-]+', '__THIRD_PARTY_GITHUB__', s)
                  if word_identity.search(masked) or exact_gh.search(masked) or exact_domains.search(masked):
                      residual.append('TEXT:'+rel)

          print('ACTIONABLE_IDENTITY_RESIDUAL_COUNT='+str(len(residual)))
          if residual:
              print('\n'.join(residual[:200]))
              raise SystemExit(1)
          print('PURE_SILA_IDENTITY_GATE=PASS')
          PY

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Install exact dependencies
        working-directory: target
        run: npm ci

      - name: Verify full build
        working-directory: target
        run: npm run build
